name: Dati carte (giornaliero)
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dati del giorno precedente
        run: git clone -q --depth 1 -b data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-out || mkdir -p data-out
      - name: Costruisci i dati
        run: node tools/build-data.mjs data-out 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Impronte delle carte (fotocamera)
        continue-on-error: true
        timeout-minutes: 70
        run: npm i --no-save --no-audit --no-fund sharp && node tools/fingerprints.mjs data-out 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Registro in caso di errore
        if: failure()
        run: |
          mkdir -p logdir && cp build.log logdir/ || true
          cd logdir && git init -q -b log && git config user.name raskio91 && git config user.email raskio91@users.noreply.github.com
          git add -A && git commit -q -m log && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" log
      - name: Pubblica sul branch data
        run: |
          cd data-out && rm -rf .git && git init -q -b data && git config user.name raskio91 && git config user.email raskio91@users.noreply.github.com
          git add -A && git commit -q -m "Dati $(date -u +%F)" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
